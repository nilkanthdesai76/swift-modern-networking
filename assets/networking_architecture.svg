<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)" rx="14"/>

  <!-- Step 1: Endpoint Protocol -->
  <rect x="40" y="90" width="180" height="140" rx="10" fill="url(#cardGrad)" stroke="#38ef7d" stroke-width="1.5"/>
  <circle cx="130" cy="120" r="16" fill="#38ef7d" fill-opacity="0.15"/>
  <text x="130" y="125" text-anchor="middle" font-size="14">🌐</text>
  <text x="130" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Endpoint</text>
  <text x="130" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">URL, Headers</text>
  <text x="130" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Query &amp; Body</text>

  <!-- Arrow 1 -->
  <path d="M 220,160 L 270,160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="270,160 262,155 262,165" fill="#8b949e"/>

  <!-- Step 2: Interceptors -->
  <rect x="280" y="90" width="180" height="140" rx="10" fill="url(#cardGrad)" stroke="#00c6ff" stroke-width="1.5"/>
  <circle cx="370" cy="120" r="16" fill="#00c6ff" fill-opacity="0.15"/>
  <text x="370" y="125" text-anchor="middle" font-size="14">🛡️</text>
  <text x="370" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Interceptors</text>
  <text x="370" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Auth Tokens</text>
  <text x="370" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Logging / Tracing</text>

  <!-- Arrow 2 -->
  <polygon points="510,160 502,155 502,165" fill="#8b949e"/>
  <path d="M 460,160 L 510,160" stroke="#8b949e" stroke-width="2"/>

  <!-- Step 3: NetworkClient Actor -->
  <rect x="520" y="90" width="200" height="140" rx="10" fill="url(#cardGrad)" stroke="#ffa116" stroke-width="1.5"/>
  <circle cx="620" cy="120" r="16" fill="#ffa116" fill-opacity="0.15"/>
  <text x="620" y="125" text-anchor="middle" font-size="14">⚡️</text>
  <text x="620" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">NetworkClient Actor</text>
  <text x="620" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Exponential Backoff</text>
  <text x="620" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">5xx Auto-Retry</text>

  <!-- Arrow 3 -->
  <polygon points="770,160 762,155 762,165" fill="#8b949e"/>
  <path d="M 720,160 L 770,160" stroke="#8b949e" stroke-width="2"/>

  <!-- Step 4: Codable Response -->
  <rect x="780" y="90" width="180" height="140" rx="10" fill="url(#cardGrad)" stroke="#e36fee" stroke-width="1.5"/>
  <circle cx="870" cy="120" r="16" fill="#e36fee" fill-opacity="0.15"/>
  <text x="870" y="125" text-anchor="middle" font-size="14">📦</text>
  <text x="870" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Decoded Output</text>
  <text x="870" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">T: Decodable</text>
  <text x="870" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Sendable Safe</text>

  <!-- Top Title -->
  <text x="500" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Swift 6 Concurrency-Safe Request Pipeline</text>
</svg>
